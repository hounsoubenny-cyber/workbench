name: 'Tests — socle, Docukit, Mediakit'

on:
  push:
    paths: ['src/**', '.github/workflows/docukit-tests.yml', 'pyproject.toml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Outils système (qpdf, poppler, tesseract, ffmpeg, sox, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng \
            ffmpeg sox libsox-fmt-all imagemagick libmagic1

      # Le paquet pandoc d'Ubuntu ne sait pas produire docx/odt/epub en mode --sandbox
      # (fichiers de données externes). Le binaire officiel, si : on teste ce chemin aussi.
      - name: pandoc officiel
        run: |
          curl -sSL https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-linux-amd64.tar.gz \
            | sudo tar xz --strip-components=1 -C /usr/local
          /usr/local/bin/pandoc --version | head -1

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }

      - name: Dépendances Python
        run: |
          pip install -r src/workbench/products/docukit/requirements-dev.txt python-magic
          pip install -e .

      # Les tests `magick` exigent ImageMagick 7 : sur ce runner (ImageMagick 6) ils sont SAUTÉS, pas en échec.
      - name: Tests (socle + Docukit + Mediakit)
        run: python -m pytest src/workbench -q

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Test de fumée de l'interface
        working-directory: src/workbench/products/docukit/frontend/tests
        run: |
          npm install --no-audit --no-fund
          node smoke.mjs
