name: 'Build Mediakit Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            os_label: 'linux'
            artifact_ext: ''
          - platform: 'windows-latest'
            os_label: 'windows'
            artifact_ext: '.exe'
          - platform: 'macos-latest'
            os_label: 'macos'
            artifact_ext: ''

    runs-on: ${{ matrix.platform }}

    env:
      MEDIAKIT_DIR: src/workbench/products/mediakit

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Frontend déjà buildé et committé (dist/) — aucune étape npm/bun ici.
      # ⚠️ Avant de commit dist/, vérifier que public/config.json utilise des
      # URLs RELATIVES ("apiBaseUrl": "/api") — le port backend est dynamique,
      # une URL absolue fige un port qui n'existera plus au prochain lancement.

      # ─── Backend Python ───
      - name: Installer les dépendances Python (workbench + mediakit)
        run: |
          pip install -r requirements.txt
          pip install -r ${{ env.MEDIAKIT_DIR }}/requirements.txt
          pip install pyinstaller

      # ─── Windows Defender ralentit/bloque PyInstaller (scan temps réel de
      # chaque DLL pendant "Looking for dynamic libraries") — désactivation
      # temporaire, le runner GitHub tourne déjà en admin ───
      - name: Désactiver Windows Defender temporairement
        if: matrix.platform == 'windows-latest'
        shell: powershell
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "D:\a"
          Add-MpPreference -ExclusionProcess "pyinstaller.exe"
          Add-MpPreference -ExclusionProcess "python.exe"

      - name: Compiler le backend avec PyInstaller (.spec) — Windows
        if: matrix.platform == 'windows-latest'
        working-directory: ${{ env.MEDIAKIT_DIR }}/api
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $env:Path = "$pythonDir;$pythonDir\Scripts;C:\Windows\system32;C:\Windows"
          Write-Host "PATH réduit à : $env:Path"
          pyinstaller mediakit.spec

      - name: Compiler le backend avec PyInstaller (.spec) — Unix
        if: matrix.platform != 'windows-latest'
        working-directory: ${{ env.MEDIAKIT_DIR }}/api
        env:
          PYTHONUTF8: "1"
        run: pyinstaller mediakit.spec

      # ─── Renommer pour un nom clair et unique par OS dans la Release ───
      - name: Renommer le binaire pour la release (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mv ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-backend \
             ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-${{ matrix.os_label }}
          chmod +x ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-${{ matrix.os_label }}

      - name: Renommer le binaire pour la release (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mv ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-backend.exe \
             ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-${{ matrix.os_label }}.exe

      # ─── Publication sur la Release GitHub (brouillon) ───
      - name: Publier le binaire sur la Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.MEDIAKIT_DIR }}/api/dist/mediakit-${{ matrix.os_label }}${{ matrix.artifact_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
